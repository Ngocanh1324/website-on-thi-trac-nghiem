let activeQuestions = [];
let userAnswersState = {};
let currentQIndex = 0;
let timerInterval = null;
let wrongQuestionsList = [];

// Hàm đảo vị trí ngẫu nhiên mảng
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startQuiz(isReview = false, customList = null) {
    if (isReview) {
        activeQuestions = customList;
    } else {
        const chapterKey = document.getElementById('chapterSelect').value;
        let originalList = rawDatabase.filter(q => q.chapter === chapterKey);
        activeQuestions = JSON.parse(JSON.stringify(originalList));
        
        // Trộn thứ tự câu hỏi trong bài
        shuffleArray(activeQuestions);

        // Trộn thứ tự đáp án/phương án lựa chọn bên trong từng câu
        activeQuestions.forEach(q => {
            if (q.type === 'mc') {
                let mapped = q.options.map((opt, i) => ({ text: opt, isCorrect: q.correct.includes(i) }));
                shuffleArray(mapped);
                q.options = mapped.map(m => m.text);
                q.correct = mapped.reduce((acc, curr, i) => { if (curr.isCorrect) acc.push(i); return acc; }, []);
            } else if (q.type === 'match') {
                shuffleArray(q.pairs);
                shuffleArray(q.options);
            }
        });
    }

    userAnswersState = {};
    currentQIndex = 0;
    
    document.getElementById('selection-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';

    document.getElementById('total-q-num').innerText = activeQuestions.length;
    
    renderCurrentQuestion();
    startTimer(45 * 60);
}

function startExamSimulator() {
    let allShuffled = JSON.parse(JSON.stringify(rawDatabase));
    shuffleArray(allShuffled);
    let exam50 = allShuffled.slice(0, 50);

    exam50.forEach(q => {
        if (q.type === 'mc') {
            let mapped = q.options.map((opt, i) => ({ text: opt, isCorrect: q.correct.includes(i) }));
            shuffleArray(mapped);
            q.options = mapped.map(m => m.text);
            q.correct = mapped.reduce((acc, curr, i) => { if (curr.isCorrect) acc.push(i); return acc; }, []);
        } else if (q.type === 'match') {
            shuffleArray(q.pairs);
            shuffleArray(q.options);
        }
    });

    activeQuestions = exam50;
    userAnswersState = {};
    currentQIndex = 0;

    document.getElementById('selection-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';

    document.getElementById('total-q-num').innerText = activeQuestions.length;
    
    renderCurrentQuestion();
    startTimer(45 * 60);
}

function renderCurrentQuestion() {
    const q = activeQuestions[currentQIndex];
    document.getElementById('current-q-num').innerText = currentQIndex + 1;
    
    document.getElementById('prev-btn').disabled = (currentQIndex === 0);
    document.getElementById('next-btn').disabled = (currentQIndex === activeQuestions.length - 1);

    const container = document.getElementById('single-question-container');
    container.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'question-card';

    let html = `<div class="question-title">${q.q}</div>`;

    const savedAns = userAnswersState[currentQIndex];

    if (q.type === 'mc') {
        const isMulti = q.correct.length > 1;
        const inputType = isMulti ? 'checkbox' : 'radio';

        q.options.forEach((optText, optIdx) => {
            let checked = false;
            if (savedAns && Array.isArray(savedAns) && savedAns.includes(optIdx)) {
                checked = true;
            }
            html += `
                <label class="option-item" id="opt-label-${optIdx}">
                    <input type="${inputType}" name="q-option" value="${optIdx}" ${checked ? 'checked' : ''} onchange="saveMcChoice(${isMulti})">
                    <span>${optText}</span>
                </label>
            `;
        });
    } else if (q.type === 'tf') {
        q.subs.forEach((sub, subIdx) => {
            let checkedVal = savedAns ? savedAns[subIdx] : '';
            html += `
                <div class="sub-item" id="tf-card-${subIdx}">
                    <div class="sub-title">${sub.title}</div>
                    <div class="tf-options">
                        <label class="tf-label"><input type="radio" name="tf-${subIdx}" value="ĐÚNG" ${checkedVal === 'ĐÚNG' ? 'checked' : ''} onchange="saveTfChoice(${subIdx}, 'ĐÚNG')"> ĐÚNG</label>
                        <label class="tf-label"><input type="radio" name="tf-${subIdx}" value="SAI" ${checkedVal === 'SAI' ? 'checked' : ''} onchange="saveTfChoice(${subIdx}, 'SAI')"> SAI</label>
                    </div>
                </div>
            `;
        });
    } else if (q.type === 'fill') {
        let textVal = savedAns || '';
        html += `<input type="text" class="fill-input" id="fill-input-field" value="${textVal}" placeholder="Nhập đáp án của bạn..." oninput="saveFillChoice(this.value)">`;
    } else if (q.type === 'match') {
        html += `
            <div class="drag-container">
                <span style="width:100%; font-size:13px; font-weight:bold; color:#475569;">Các thẻ phương án lựa chọn:</span>
                ${q.options.map((opt, oIdx) => `<div class="draggable-tag" draggable="true" ondragstart="drag(event)" id="tag-${oIdx}">${opt}</div>`).join('')}
            </div>
        `;
        q.pairs.forEach((pair, pIdx) => {
            let matchedVal = (savedAns && savedAns[pIdx]) ? savedAns[pIdx] : '';
            html += `
                <div class="sub-item" id="match-card-${pIdx}">
                    <div class="sub-title">${pair.item} ➔ </div>
                    <select onchange="saveMatchChoice(${pIdx}, this.value)" style="margin-top:6px;">
                        <option value="">-- Chọn vế ghép đúng --</option>
                        ${q.options.map(opt => `<option value="${opt}" ${matchedVal === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>
                </div>
            `;
        });
    }

    html += `<div class="feedback" id="current-feedback"></div>`;
    card.innerHTML = html;
    container.appendChild(card);
}

function saveMcChoice(isMulti) {
    const selected = document.querySelectorAll('input[name="q-option"]:checked');
    const values = Array.from(selected).map(el => parseInt(el.value));
    userAnswersState[currentQIndex] = values;
}

function saveTfChoice(subIdx, val) {
    if (!userAnswersState[currentQIndex]) userAnswersState[currentQIndex] = {};
    userAnswersState[currentQIndex][subIdx] = val;
}

function saveFillChoice(val) {
    userAnswersState[currentQIndex] = val;
}

function saveMatchChoice(pIdx, val) {
    if (!userAnswersState[currentQIndex]) userAnswersState[currentQIndex] = {};
    userAnswersState[currentQIndex][pIdx] = val;
}

function checkCurrentAnswer() {
    const q = activeQuestions[currentQIndex];
    const feedbackDiv = document.getElementById('current-feedback');
    feedbackDiv.style.display = 'block';

    const saved = userAnswersState[currentQIndex];

    if (q.type === 'mc') {
        const userAns = saved || [];
        const correctAns = q.correct;
        
        const isExact = (userAns.length === correctAns.length) && userAns.every(v => correctAns.includes(v));

        q.options.forEach((_, optIdx) => {
            const label = document.getElementById(`opt-label-${optIdx}`);
            label.classList.remove('correct-answer-highlight', 'wrong-answer-highlight');
            if (correctAns.includes(optIdx)) label.classList.add('correct-answer-highlight');
            else if (userAns.includes(optIdx)) label.classList.add('wrong-answer-highlight');
        });

        if (isExact) {
            feedbackDiv.className = 'feedback correct';
            feedbackDiv.innerHTML = '✔ Chính xác!';
        } else {
            feedbackDiv.className = 'feedback wrong';
            let correctTexts = correctAns.map(i => q.options[i]).join(', ');
            feedbackDiv.innerHTML = `✖ Chưa đúng/chưa đủ. Đáp án đúng là: <b>${correctTexts}</b>`;
        }
    } else if (q.type === 'tf') {
        let wrongCount = 0;
        q.subs.forEach((sub, subIdx) => {
            const card = document.getElementById(`tf-card-${subIdx}`);
            card.classList.remove('correct-answer-highlight', 'wrong-answer-highlight');
            const userChoice = saved ? saved[subIdx] : null;

            if (userChoice === sub.correct) {
                card.classList.add('correct-answer-highlight');
            } else {
                card.classList.add('wrong-answer-highlight');
                wrongCount++;
            }
        });

        if (wrongCount === 0) {
            feedbackDiv.className = 'feedback correct';
            feedbackDiv.innerHTML = '✔ Chính xác tất cả các mệnh đề!';
        } else {
            feedbackDiv.className = 'feedback wrong';
            feedbackDiv.innerHTML = `✖ Trả lời sai ${wrongCount} ý. Đáp án chuẩn được tô màu xanh lục!`;
        }
    } else if (q.type === 'fill') {
        const userVal = (saved || '').trim().toLowerCase();
        const correctVal = q.answer.trim().toLowerCase();

        if (userVal === correctVal) {
            feedbackDiv.className = 'feedback correct';
            feedbackDiv.innerHTML = '✔ Chính xác!';
        } else {
            feedbackDiv.className = 'feedback wrong';
            feedbackDiv.innerHTML = `✖ Chưa đúng. Đáp án chuẩn là: "<b>${q.answer}</b>"`;
        }
    } else if (q.type === 'match') {
        let wrongCount = 0;
        q.pairs.forEach((pair, pIdx) => {
            const card = document.getElementById(`match-card-${pIdx}`);
            card.classList.remove('correct-answer-highlight', 'wrong-answer-highlight');
            const userVal = saved ? saved[pIdx] : null;

            if (userVal === pair.correct) {
                card.classList.add('correct-answer-highlight');
            } else {
                card.classList.add('wrong-answer-highlight');
                wrongCount++;
            }
        });

        if (wrongCount === 0) {
            feedbackDiv.className = 'feedback correct';
            feedbackDiv.innerHTML = '✔ Ghép đúng hoàn toàn tất cả các vế!';
        } else {
            feedbackDiv.className = 'feedback wrong';
            let correctPairs = q.pairs.map(p => `${p.item} ➔ ${p.correct}`).join(' | ');
            feedbackDiv.innerHTML = `✖ Chưa chính xác. Ghép chuẩn là: <b>${correctPairs}</b>`;
        }
    }
}

function changeQuestion(step) {
    const nextIdx = currentQIndex + step;
    if (nextIdx >= 0 && nextIdx < activeQuestions.length) {
        currentQIndex = nextIdx;
        renderCurrentQuestion();
    }
}

function startTimer(duration) {
    let timer = duration;
    const timerDisplay = document.getElementById('timer');
    if (timerInterval) clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
        let minutes = parseInt(timer / 60, 10);
        let seconds = parseInt(timer % 60, 10);
        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;
        timerDisplay.textContent = minutes + ":" + seconds;

        if (--timer < 0) {
            clearInterval(timerInterval);
            alert('Hết thời gian làm bài!');
            submitQuiz();
        }
    }, 1000);
}

function submitQuiz() {
    if (timerInterval) clearInterval(timerInterval);

    let correctCount = 0;
    wrongQuestionsList = [];
    const reviewContainer = document.getElementById('review-list');
    reviewContainer.innerHTML = '';

    activeQuestions.forEach((q, idx) => {
        const saved = userAnswersState[idx];
        let isCorrect = true;

        if (q.type === 'mc') {
            const userAns = saved || [];
            isCorrect = (userAns.length === q.correct.length) && userAns.every(v => q.correct.includes(v));
        } else if (q.type === 'tf') {
            q.subs.forEach((sub, subIdx) => {
                const userVal = saved ? saved[subIdx] : null;
                if (userVal !== sub.correct) isCorrect = false;
            });
        } else if (q.type === 'fill') {
            const userVal = (saved || '').trim().toLowerCase();
            if (userVal !== q.answer.trim().toLowerCase()) isCorrect = false;
        } else if (q.type === 'match') {
            q.pairs.forEach((pair, pIdx) => {
                const userVal = saved ? saved[pIdx] : null;
                if (userVal !== pair.correct) isCorrect = false;
            });
        }

        if (isCorrect) {
            correctCount++;
        } else {
            wrongQuestionsList.push(q);
        }

        // Tạo thẻ hiển thị chi tiết câu trả lời
        const card = document.createElement('div');
        card.className = `review-card ${isCorrect ? 'correct-answer-highlight' : 'wrong-answer-highlight'}`;
        
        let cardHtml = `<div style="font-weight:bold; margin-bottom:8px;">Câu ${idx + 1}: ${q.q}</div>`;
        cardHtml += `<div>Trạng thái: <b>${isCorrect ? '✔ ĐÚNG' : '✖ SAI / THIẾU'}</b></div>`;

        if (q.type === 'mc') {
            let correctText = q.correct.map(i => q.options[i]).join(', ');
            cardHtml += `<div style="font-size:13px; margin-top:4px;">Đáp án chuẩn: <b>${correctText}</b></div>`;
        } else if (q.type === 'tf') {
            let correctText = q.subs.map(s => `${s.title}: ${s.correct}`).join(' | ');
            cardHtml += `<div style="font-size:13px; margin-top:4px;">Đáp án chuẩn: <b>${correctText}</b></div>`;
        } else if (q.type === 'fill') {
            cardHtml += `<div style="font-size:13px; margin-top:4px;">Đáp án chuẩn: <b>${q.answer}</b></div>`;
        } else if (q.type === 'match') {
            let correctText = q.pairs.map(p => `${p.item} ➔ ${p.correct}`).join(' | ');
            cardHtml += `<div style="font-size:13px; margin-top:4px;">Đáp án chuẩn: <b>${correctText}</b></div>`;
        }

        card.innerHTML = cardHtml;
        reviewContainer.appendChild(card);
    });

    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    const scorePercent = ((correctCount / activeQuestions.length) * 100).toFixed(1);
    document.getElementById('result-summary').innerHTML = `TỔNG KẾT BÀI THI: ${correctCount} / ${activeQuestions.length} CÂU ĐÚNG (${scorePercent}%)`;

    const wrongBtn = document.getElementById('review-wrong-btn');
    if (wrongQuestionsList.length > 0) {
        wrongBtn.style.display = 'block';
        wrongBtn.innerText = `Ôn Lại Các Câu Trả Lời Sai / Chọn Thiếu (${wrongQuestionsList.length} câu)`;
    } else {
        wrongBtn.style.display = 'none';
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startReviewWrong() {
    startQuiz(true, wrongQuestionsList);
}

function backToSelection() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('selection-screen').style.display = 'block';
}
</script>
