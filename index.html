<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Ôn Thi Trắc Nghiệm - ICTU</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --danger-color: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--border-color); }
        header h1 { color: var(--primary-color); font-size: 24px; margin-bottom: 5px; }
        header p { color: #64748b; font-size: 14px; }

        .select-group { margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; }
        select, input[type="text"], button { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 15px; outline: none; }
        select, input[type="text"] { background-color: #fff; margin-bottom: 10px; }
        
        .btn { background-color: var(--primary-color); color: white; border: none; font-weight: 600; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-exam { background-color: #d97706; }
        .btn-exam:hover { background-color: #b45309; }
        .btn-secondary { background-color: #64748b; width: auto; padding: 8px 16px; margin-bottom: 15px; font-size: 14px; }
        .btn-secondary:hover { background-color: #475569; }
        .btn-check { background-color: #0d9488; padding: 8px 14px; width: auto; font-size: 13px; margin-top: 10px; }
        .btn-check:hover { background-color: #0f766e; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; background: #eff6ff; padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; font-size: 14px; }
        .question-card { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .question-title { font-weight: 700; font-size: 16px; margin-bottom: 12px; color: #0f172a; }
        
        .option-item { display: flex; align-items: flex-start; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s; font-size: 14px; }
        .option-item:hover { background-color: #f1f5f9; }
        .option-item input { margin-top: 3px; margin-right: 12px; }

        .tf-sub-item { background: #f8fafc; border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; margin-bottom: 10px; }
        .tf-sub-title { font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #334155; }
        .tf-options { display: flex; gap: 20px; }
        .tf-label { display: flex; align-items: center; cursor: pointer; font-size: 14px; font-weight: 600; }
        .tf-label input { margin-right: 6px; }

        .fill-input { max-width: 350px; display: inline-block; margin-top: 8px; padding: 8px 12px; font-size: 14px; border: 1px solid var(--border-color); border-radius: 6px; }

        .feedback { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; display: none; }
        .feedback.correct { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .feedback.wrong { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

        .correct-answer-highlight { background-color: #dcfce7 !important; border-color: #86efac !important; }
        .wrong-answer-highlight { background-color: #fee2e2 !important; border-color: #fca5a5 !important; }

        .result-screen { text-align: center; padding: 20px; display: none; }
        .result-box { padding: 20px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; margin-bottom: 20px; font-size: 18px; font-weight: bold; color: #166534; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ÔN THI TRẮC NGHIỆM TRỰC TUYẾN - ICTU</h1>
        <p>Hệ thống ngân hàng câu hỏi ôn tập đầy đủ các môn học</p>
    </header>

    <div id="selection-screen">
        <div class="select-group">
            <label for="subjectSelect">1. Chọn Môn Học:</label>
            <select id="subjectSelect" onchange="updateChapterOptions()">
                <option value="">-- Chọn môn học --</option>
                <option value="hvtnd">Hành Vi Người Tiêu Dùng</option>
                <option value="mkt">Chiến Lược & Kế Hoạch Marketing Số</option>
            </select>
        </div>

        <div class="select-group">
            <label for="chapterSelect">2. Chọn Bài Ôn Tập:</label>
            <select id="chapterSelect" disabled>
                <option value="">-- Vui lòng chọn môn học trước --</option>
            </select>
        </div>

        <button class="btn" id="start-btn" onclick="startQuiz()" disabled>Bắt Đầu Ôn Tập Theo Bài Này</button>
        <button class="btn btn-exam" id="exam-btn" onclick="startExamSimulator()" disabled>🚀 Thi Thử Hỗn Hợp 50 Câu Ngẫu Nhiên</button>
    </div>

    <div id="quiz-screen" style="display: none;">
        <button class="btn btn-secondary" onclick="backToSelection()">⬅ Quay lại trang chủ</button>
        
        <div class="quiz-header">
            <span id="quiz-title-display">Môn học</span>
            <span>Thời gian: <span id="timer" style="color: var(--danger-color);">45:00</span></span>
        </div>

        <div id="questions-list"></div>

        <button class="btn" id="submit-btn" onclick="submitQuiz()">Nộp Bài Tổng Kết</button>
    </div>

    <div id="result-screen" class="result-screen">
        <div id="result-summary" class="result-box"></div>
        <button class="btn" onclick="reviewWrongAnswers()" id="review-btn" style="background-color: #d97706; margin-bottom: 10px; display: none;">Ôn Lại Các Câu Trả Lời Sai</button>
        <button class="btn btn-secondary" onclick="backToSelection()" style="width: 100%;">Quay Về Trang Chủ</button>
    </div>
</div>

<script>
const quizDatabase = {
    hvtnd: {
        title: "Hành Vi Người Tiêu Dùng",
        chapters: {
            "bai1": "Bài 1: Tổng quan về Hành vi Người tiêu dùng",
            "bai2": "Bài 2: Phân loại & Chân dung Khách hàng",
            "bai3": "Bài 3: Yếu tố Nhân khẩu học & Lối sống",
            "bai4": "Bài 4: Động cơ, Nhận thức, Trí nhớ & Thái độ",
            "bai5": "Bài 5: Yếu tố Xã hội, Văn hóa & Nhóm tham khảo",
            "bai6": "Bài 6: Hành trình & Quyết định mua hàng",

let currentQuestions = [];
let wrongQuestionsList = [];
let timerInterval = null;

function updateChapterOptions() {
    const subjectKey = document.getElementById('subjectSelect').value;
    const chapterSelect = document.getElementById('chapterSelect');
    const startBtn = document.getElementById('start-btn');
    const examBtn = document.getElementById('exam-btn');
    
    chapterSelect.innerHTML = '';
    
    if (!subjectKey) {
        chapterSelect.innerHTML = '<option value="">-- Vui lòng chọn môn học trước --</option>';
        chapterSelect.disabled = true;
        startBtn.disabled = true;
        examBtn.disabled = true;
        return;
    }
    
    const chapters = quizDatabase[subjectKey].chapters;
    for (let key in chapters) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = chapters[key];
        chapterSelect.appendChild(opt);
    }
    chapterSelect.disabled = false;
    startBtn.disabled = false;
    examBtn.disabled = false;
}

function startQuiz(isReview = false, customList = null) {
    if (isReview) {
        currentQuestions = customList;
    } else {
        const subjectKey = document.getElementById('subjectSelect').value;
        const chapterKey = document.getElementById('chapterSelect').value;
        
        if (!subjectKey || !chapterKey) {
            alert('Vui lòng chọn môn và bài ôn tập!');
            return;
        }
        
        const subjectData = quizDatabase[subjectKey];
        currentQuestions = JSON.parse(JSON.stringify(subjectData.questions.filter(q => q.chapter === chapterKey)));
    }
    
    if (currentQuestions.length === 0) {
        alert('Bài này chưa có câu hỏi hoặc đang cập nhật!');
        return;
    }

    setupQuizScreen("Ôn tập theo bài");
}

function startExamSimulator() {
    const subjectKey = document.getElementById('subjectSelect').value;
    if (!subjectKey) {
        alert('Vui lòng chọn môn học trước!');
        return;
    }
    
    const allQuestions = quizDatabase[subjectKey].questions;
    let shuffled = JSON.parse(JSON.stringify(allQuestions)).sort(() => Math.random() - 0.5);
    currentQuestions = shuffled.slice(0, 50);
    
    setupQuizScreen("Thi thử hỗn hợp Ngẫu nhiên");
}

function setupQuizScreen(modeTitle) {
    document.getElementById('selection-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('quiz-title-display').innerText = modeTitle;
    
    renderQuestions();
    startTimer(45 * 60);
}

function renderQuestions() {
    const listContainer = document.getElementById('questions-list');
    listContainer.innerHTML = '';
    
    currentQuestions.forEach((qItem, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${idx}`;
        
        let html = `<div class="question-title">${qItem.q}</div>`;
        
        if (qItem.type === 'mc') {
            const isMulti = qItem.correct.length > 1;
            qItem.options.forEach((optText, optIdx) => {
                const inputType = isMulti ? 'checkbox' : 'radio';
                html += `
                    <label class="option-item" id="opt-label-${idx}-${optIdx}">
                        <input type="${inputType}" name="q-${idx}" value="${optIdx}">
                        <span>${optText}</span>
                    </label>
                `;
            });
        } else if (qItem.type === 'tf') {
            qItem.subs.forEach((sub, subIdx) => {
                html += `
                    <div class="tf-sub-item" id="tf-card-${idx}-${subIdx}">
                        <div class="tf-sub-title">${sub.title}</div>
                        <div class="tf-options">
                            <label class="tf-label"><input type="radio" name="tf-${idx}-${subIdx}" value="ĐÚNG"> ĐÚNG</label>
                            <label class="tf-label"><input type="radio" name="tf-${idx}-${subIdx}" value="SAI"> SAI</label>
                        </div>
                    </div>
                `;
            });
        } else if (qItem.type === 'fill') {
            html += `<input type="text" class="fill-input" id="fill-${idx}" placeholder="Nhập đáp án của bạn...">`;
        }
        
        html += `<br><button class="btn btn-check" onclick="checkSingleQuestion(${idx})">Kiểm tra câu này</button>`;
        html += `<div class="feedback" id="feedback-${idx}"></div>`;
        
        card.innerHTML = html;
        listContainer.appendChild(card);
    });
}

function checkSingleQuestion(idx) {
    const qItem = currentQuestions[idx];
    const feedbackDiv = document.getElementById(`feedback-${idx}`);
    feedbackDiv.style.display = 'block';
    let isCorrect = true;

    if (qItem.type === 'mc') {
        const selectedInputs = document.querySelectorAll(`input[name="q-${idx}"]:checked`);
        const userAnswers = Array.from(selectedInputs).map(i => parseInt(i.value));
        const correctAnswers = qItem.correct;
        
        isCorrect = userAnswers.length === correctAnswers.length && userAnswers.every(val => correctAnswers.includes(val));
        
        qItem.options.forEach((_, optIdx) => {
            const label = document.getElementById(`opt-label-${idx}-${optIdx}`);
            label.classList.remove('correct-answer-highlight', 'wrong-answer-highlight');
            if (correctAnswers.includes(optIdx)) label.classList.add('correct-answer-highlight');
            else if (userAnswers.includes(optIdx)) label.classList.add('wrong-answer-highlight');
        });

        if (isCorrect) {
            feedbackDiv.className = 'feedback correct';
            feedbackDiv.innerHTML = '✔ Chính xác!';
        } else {
            feedbackDiv.className = 'feedback wrong';
            let correctText = correctAnswers.map(ansIdx => `"${qItem.options[ansIdx]}"`).join(', ');
            feedbackDiv.innerHTML = `✖ Chưa chính xác. Đáp án đúng là: ${correctText}`;
        }
    } else if (qItem.type === 'tf') {
        let wrongCount = 0;
        qItem.subs.forEach((sub, subIdx) => {
            const selected = document.querySelector(`input[name="tf-${idx}-${subIdx}"]:checked`);
            const subCard = document.getElementById(`tf-card-${idx}-${subIdx}`);
            subCard.classList.remove('correct-answer-highlight', 'wrong-answer-highlight');
            
            if (selected && selected.value === sub.correct) {
                subCard.classList.add('correct-answer-highlight');
            } else {
                subCard.classList.add('wrong-answer-highlight');
                wrongCount++;
            }
        });

        if (wrongCount === 0) {
            feedbackDiv.className = 'feedback correct';
            feedbackDiv.innerHTML = '✔ Chính xác toàn bộ các ý Đúng/Sai!';
        } else {
            feedbackDiv.className = 'feedback wrong';
            feedbackDiv.innerHTML = `✖ Bạn trả lời sai ${wrongCount} ý nhỏ. Đáp án chuẩn được tô xanh!`;
        }
    } else if (qItem.type === 'fill') {
        const userVal = document.getElementById(`fill-${idx}`).value.trim().toLowerCase();
        const correctVal = qItem.answer.trim().toLowerCase();
        
        if (userVal === correctVal) {
            feedbackDiv.className = 'feedback correct';
            feedbackDiv.innerHTML = '✔ Chính xác!';
        } else {
            feedbackDiv.className = 'feedback wrong';
            feedbackDiv.innerHTML = `✖ Chưa chính xác. Đáp án đúng là: "${qItem.answer}"`;
        }
    }
}

function startTimer(duration) {
    let timer = duration;
    const timerDisplay = document.getElementById('timer');
    if (timerInterval) clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
        let minutes = parseInt(timer / 60, 10);
        let seconds = parseInt(timer % 60, 10);
        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;
        timerDisplay.textContent = minutes + ":" + seconds;

        if (--timer < 0) {
            clearInterval(timerInterval);
            alert('Đã hết thời gian làm bài!');
            submitQuiz();
        }
    }, 1000);
}

function submitQuiz() {
    clearInterval(timerInterval);
    let score = 0;
    wrongQuestionsList = [];
    
    currentQuestions.forEach((qItem, idx) => {
        checkSingleQuestion(idx);
        
        let isCorrect = true;
        if (qItem.type === 'mc') {
            const selectedInputs = document.querySelectorAll(`input[name="q-${idx}"]:checked`);
            const userAnswers = Array.from(selectedInputs).map(i => parseInt(i.value));
            isCorrect = userAnswers.length === qItem.correct.length && userAnswers.every(val => qItem.correct.includes(val));
        } else if (qItem.type === 'tf') {
            qItem.subs.forEach((sub, subIdx) => {
                const selected = document.querySelector(`input[name="tf-${idx}-${subIdx}"]:checked`);
                if (!selected || selected.value !== sub.correct) isCorrect = false;
            });
        } else if (qItem.type === 'fill') {
            const userVal = document.getElementById(`fill-${idx}`).value.trim().toLowerCase();
            if (userVal !== qItem.answer.trim().toLowerCase()) isCorrect = false;
        }
        
        if (isCorrect) score++;
        else wrongQuestionsList.push(qItem);
    });
    
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    
    const percent = ((score / currentQuestions.length) * 100).toFixed(1);
    document.getElementById('result-summary').innerHTML = `KẾT QUẢ TỔNG KẾT: ${score} / ${currentQuestions.length} CÂU ĐÚNG (${percent}%)`;
    
    const reviewBtn = document.getElementById('review-btn');
    if (wrongQuestionsList.length > 0) {
        reviewBtn.style.display = 'block';
        reviewBtn.innerText = `Ôn Lại Các Câu Trả Lời Sai (${wrongQuestionsList.length} câu)`;
    } else {
        reviewBtn.style.display = 'none';
        alert('Chúc mừng bạn đã trả lời đúng tuyệt đối!');
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reviewWrongAnswers() {
    startQuiz(true, wrongQuestionsList);
}

function backToSelection() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('selection-screen').style.display = 'block';
}
</script>
