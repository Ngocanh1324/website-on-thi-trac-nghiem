<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Ôn Thi Trắc Nghiệm - ICTU</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --danger-color: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); }
        
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        header h1 { color: var(--primary-color); font-size: 26px; margin-bottom: 8px; }
        header p { color: #64748b; font-size: 15px; }

        .select-group { margin-bottom: 20px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; }
        select, button { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 15px; outline: none; }
        select { background-color: #fff; cursor: pointer; margin-bottom: 15px; }
        
        .btn { background-color: var(--primary-color); color: white; border: none; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #64748b; margin-bottom: 20px; }
        .btn-secondary:hover { background-color: #475569; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; background: #eff6ff; padding: 15px 20px; border-radius: 8px; margin-bottom: 25px; font-weight: 600; }
        .question-card { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .question-title { font-weight: 600; font-size: 16px; margin-bottom: 15px; color: #0f172a; }
        
        .option-item { display: flex; align-items: flex-start; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s; }
        .option-item:hover { background-color: #f1f5f9; }
        .option-item input { margin-top: 4px; margin-right: 12px; }
        
        .result-box { text-align: center; padding: 20px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; margin-top: 25px; font-size: 18px; font-weight: bold; color: #166534; display: none; }
        
        .correct-answer { background-color: #dcfce7 !important; border-color: #86efac !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #fca5a5 !important; }
        
        .sub-q { margin-top: 10px; padding-left: 15px; border-left: 3px solid var(--primary-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CỔNG ÔN THI TRẮC NGHIỆM TRỰC TUYẾN</h1>
        <p>Hệ thống ngân hàng câu hỏi tự động dành cho sinh viên</p>
    </header>

    <!-- KHU VỰC CHỌN MÔN HỌC & BÀI HỌC -->
    <div id="selection-screen">
        <div class="select-group">
            <label for="subjectSelect">1. Chọn Môn Học:</label>
            <select id="subjectSelect" onchange="updateChapterOptions()">
                <option value="">-- Chọn môn học --</option>
                <option value="hvtnd">Hành Vi Người Tiêu Dùng</option>
                <option value="mkt">Chiến Lược & Kế Hoạch Marketing Số</option>
            </select>
        </div>

        <div class="select-group">
            <label for="chapterSelect">2. Chọn Bài / Chương Ôn Tập:</label>
            <select id="chapterSelect" disabled>
                <option value="">-- Vui lòng chọn môn học trước --</option>
            </select>
        </div>

        <button class="btn" onclick="startQuiz()">Bắt Đầu Làm Bài</button>
    </div>

    <!-- KHU VỰC LÀM BÀI TRẮC NGHIỆM -->
    <div id="quiz-screen" style="display: none;">
        <button class="btn btn-secondary" onclick="backToSelection()">⬅ Quay lại chọn bài</button>
        
        <div class="quiz-header">
            <span id="quiz-title-display">Môn học</span>
            <span>Thời gian còn lại: <span id="timer" style="color: var(--danger-color);">30:00</span></span>
        </div>

        <div id="questions-list"></div>

        <button class="btn" id="submit-btn" onclick="submitQuiz()">Nộp Bài & Xem Đáp Án</button>
        <div id="result-box" class="result-box"></div>
    </div>
</div>

<script>

};

let currentQuestions = [];
let timerInterval = null;

// ==================== XỬ LÝ GIAO DIỆN ====================
function updateChapterOptions() {
    const subjectKey = document.getElementById('subjectSelect').value;
    const chapterSelect = document.getElementById('chapterSelect');
    
    chapterSelect.innerHTML = '';
    
    if (!subjectKey) {
        chapterSelect.innerHTML = '<option value="">-- Vui lòng chọn môn học trước --</option>';
        chapterSelect.disabled = true;
        return;
    }
    
    const chapters = quizDatabase[subjectKey].chapters;
    for (let key in chapters) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = chapters[key];
        chapterSelect.appendChild(opt);
    }
    
    chapterSelect.disabled = false;
}

function startQuiz() {
    const subjectKey = document.getElementById('subjectSelect').value;
    const chapterKey = document.getElementById('chapterSelect').value;
    
    if (!subjectKey || !chapterKey) {
        alert('Vui lòng chọn đầy đủ Môn học và Bài ôn tập!');
        return;
    }
    
    const subjectData = quizDatabase[subjectKey];
    
    if (chapterKey === 'all') {
        currentQuestions = subjectData.questions;
    } else {
        currentQuestions = subjectData.questions.filter(q => q.chapter === chapterKey);
    }
    
    if (currentQuestions.length === 0) {
        alert('Hiện chưa có câu hỏi trong phần này, vui lòng chọn phần khác!');
        return;
    }

    document.getElementById('selection-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('quiz-title-display').innerText = subjectData.title + " - " + subjectData.chapters[chapterKey];
    
    renderQuestions();
    startTimer(30 * 60); // 30 phút
}

function renderQuestions() {
    const listContainer = document.getElementById('questions-list');
    listContainer.innerHTML = '';
    
    currentQuestions.forEach((qItem, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${idx}`;
        
        let html = `<div class="question-title">${idx + 1}. ${qItem.q}</div>`;
        
        qItem.options.forEach((optText, optIdx) => {
            const inputType = qItem.multi ? 'checkbox' : 'radio';
            html += `
                <label class="option-item" id="opt-label-${idx}-${optIdx}">
                    <input type="${inputType}" name="q-${idx}" value="${optIdx}">
                    <span>${optText}</span>
                </label>
            `;
        });
        
        card.innerHTML = html;
        listContainer.appendChild(card);
    });
}

function startTimer(duration) {
    let timer = duration;
    const timerDisplay = document.getElementById('timer');
    
    if (timerInterval) clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
        let minutes = parseInt(timer / 60, 10);
        let seconds = parseInt(timer % 60, 10);

        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        timerDisplay.textContent = minutes + ":" + seconds;

        if (--timer < 0) {
            clearInterval(timerInterval);
            alert('Đã hết thời gian làm bài!');
            submitQuiz();
        }
    }, 1000);
}

function submitQuiz() {
    clearInterval(timerInterval);
    let score = 0;
    
    currentQuestions.forEach((qItem, idx) => {
        const selectedInputs = document.querySelectorAll(`input[name="q-${idx}"]:checked`);
        const userAnswers = Array.from(selectedInputs).map(i => parseInt(i.value));
        const correctAnswers = qItem.correct;
        
        // Kiểm tra đúng/sai
        const isCorrect = userAnswers.length === correctAnswers.length && 
                          userAnswers.every(val => correctAnswers.includes(val));
        
        if (isCorrect) score++;
        
        // Hiển thị tô màu đáp án
        qItem.options.forEach((_, optIdx) => {
            const label = document.getElementById(`opt-label-${idx}-${optIdx}`);
            if (correctAnswers.includes(optIdx)) {
                label.classList.add('correct-answer');
            } else if (userAnswers.includes(optIdx)) {
                label.classList.add('wrong-answer');
            }
        });
    });
    
    const resultBox = document.getElementById('result-box');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `KẾT QUẢ: ${score} / ${currentQuestions.length} CÂU ĐÚNG (${((score/currentQuestions.length)*100).toFixed(1)}%)`;
    
    document.getElementById('submit-btn').disabled = true;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function backToSelection() {
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('selection-screen').style.display = 'block';
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('submit-btn').disabled = false;
}
</script>

</body>
</html>
