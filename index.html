<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Ôn Thi Trắc Nghiệm</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: 0 auto; }
        h1, h2 { text-align: center; color: #2c3e50; }
        .menu-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; text-align: left; }
        .menu-btn:hover { background: #2980b9; }
        .question-card { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
        .option { margin: 8px 0; cursor: pointer; display: block; padding: 8px; border-radius: 4px; border: 1px solid #eee; }
        .option:hover { background: #f0f0f0; }
        .btn-submit { background: #2ecc71; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; display: block; width: 100%; margin-top: 20px; }
        .btn-submit:hover { background: #27ae60; }
        .result { font-size: 18px; font-weight: bold; text-align: center; margin-top: 20px; color: #e74c3c; }
        .correct { background-color: #d4edda !important; color: #155724; border-color: #c3e6cb; }
        .wrong { background-color: #f8d7da !important; color: #721c24; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ÔN THI TRẮC NGHIỆM TRỰC TUYẾN</h1>
        <div id="subject-select">
            <h2>Chọn bộ đề ôn tập</h2>
            <button class="menu-btn" onclick="loadQuiz('hvtnd')">📘 Hành Vi Người Tiêu Dùng</button>
            <button class="menu-btn" onclick="loadQuiz('mkt')">📙 Chiến Lược & Kế Hoạch Marketing Số</button>
        </div>

        <div id="quiz-area" style="display:none;">
            <button onclick="goBack()" style="margin-bottom: 15px;">⬅ Quay lại chọn đề</button>
            <h2 id="quiz-title"></h2>
            <div id="questions-container"></div>
            <button class="btn-submit" onclick="submitQuiz()">Nộp bài & Chấm điểm</button>
            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        const quizData = {
            hvtnd: [
                {
                    q: "Câu 1: Trong nghiên cứu hành vi người tiêu dùng thì 'Người tiêu dùng' bao gồm những đối tượng nào? (Chọn các phương án đúng)",
                    options: [
                        "Chỉ những cá nhân trực tiếp sử dụng sản phẩm.",
                        "Cá nhân hoặc nhóm người có nhu cầu và tham gia vào quá trình lựa chọn, mua sắm.",
                        "Những cá nhân có liên quan đến quá trình ra quyết định mua hàng.",
                        "Chỉ các tổ chức đại diện cho tập thể mua sắm."
                    ],
                    correct: [1, 2]
                },
                {
                    q: "Câu 2: Hành vi người tiêu dùng (Consumer Behavior) nghiên cứu các hoạt động nào của cá nhân, nhóm hoặc tổ chức?",
                    options: [
                        "Việc đánh giá và loại bỏ sản phẩm, dịch vụ nhằm thỏa mãn nhu cầu.",
                        "Quá trình sản xuất và phân phối hàng hóa của doanh nghiệp.",
                        "Cách thức lựa chọn, mua sắm và sử dụng sản phẩm.",
                        "Việc thiết lập giá thành sản phẩm trên thị trường."
                    ],
                    correct: [0, 2]
                }
            ],
            mkt: [
                {
                    q: "Câu 1: Ba trụ cột của một chiến lược Marketing số toàn diện được đại diện bởi mô hình nào?",
                    options: ["SMART", "POEM", "AIDA", "4Ps"],
                    correct: [1]
                },
                {
                    q: "Câu 2: Tương tác một chiều (One-way communication) là nhược điểm chính của loại hình nào?",
                    options: ["Social Media Marketing", "Search Engine Marketing", "Email Marketing", "Marketing truyền thống"],
                    correct: [3]
                }
            ]
        };

        let currentSubject = '';

        function loadQuiz(subject) {
            currentSubject = subject;
            document.getElementById('subject-select').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            document.getElementById('quiz-title').innerText = subject === 'hvtnd' ? 'Hành Vi Người Tiêu Dùng' : 'Marketing Số';
            
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            quizData[subject].forEach((item, index) => {
                let html = `<div class="question-card">
                    <p><b>${item.q}</b></p>`;
                item.options.forEach((opt, optIdx) => {
                    html += `<label class="option">
                        <input type="checkbox" name="q${index}" value="${optIdx}"> ${opt}
                    </label>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });
            document.getElementById('result').innerText = '';
        }

        function submitQuiz() {
            let score = 0;
            const questions = quizData[currentSubject];
            
            questions.forEach((item, index) => {
                const selected = Array.from(document.querySelectorAll(`input[name="q${index}"]:checked`)).map(cb => parseInt(cb.value));
                const correct = item.correct;
                const isCorrect = selected.length === correct.length && selected.every(val => correct.includes(val));
                
                if (isCorrect) score++;
            });
            
            document.getElementById('result').innerText = `Kết quả của bạn: ${score} / ${questions.length} câu đúng!`;
        }

        function goBack() {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('subject-select').style.display = 'block';
        }
    </script>
</body>
</html>
